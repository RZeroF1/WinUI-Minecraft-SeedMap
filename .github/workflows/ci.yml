name: SDK 持续集成

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: 构建与 NuGet 验证（win-x64）
    runs-on: windows-2025
    timeout-minutes: 25

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查源码资料隔离
        shell: pwsh
        run: ./scripts/Test-ArtifactIsolation.ps1 -CheckTracked

      - name: 配置 .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 校验许可证与 Cubiomes 源码哈希
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'LICENSE',
            'THIRD-PARTY-NOTICES.md',
            'licenses/cubiomes/LICENSE',
            'licenses/cubiomes/SOURCE.md',
            'licenses/cubiomes/manifest.json'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing required license/source document: $path"
            }
          }

          $license = Get-Content -LiteralPath LICENSE -Raw
          $thirdPartyLicense = Get-Content -LiteralPath licenses/cubiomes/LICENSE -Raw
          if ($license -notmatch 'Mozilla Public License') {
            throw 'Project MPL license text was not found.'
          }
          if ($thirdPartyLicense -notmatch 'MIT License') {
            throw 'Cubiomes MIT license text was not found.'
          }

          $manifest = Get-Content -LiteralPath licenses/cubiomes/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.component -ne 'Cubiomes' -or $manifest.license -ne 'MIT') {
            throw 'Unexpected Cubiomes manifest metadata.'
          }
          $entries = @($manifest.files.PSObject.Properties)
          if ($entries.Count -eq 0) { throw 'Cubiomes manifest is empty.' }
          foreach ($entry in $entries) {
            $file = $entry.Name
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing Cubiomes source file: $file"
            }
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
            if ($hash -ne $entry.Value) {
              throw "Cubiomes SHA-256 mismatch: $file"
            }
          }
          $nativeFiles = @(Get-ChildItem native/cubiomes -Recurse -File |
            Where-Object { $_.Extension -in '.c', '.h' -or $_.Name -eq 'build.cmd' } |
            ForEach-Object { [IO.Path]::GetRelativePath((Get-Location).Path, $_.FullName).Replace('\', '/') })
          $listedFiles = @($entries | ForEach-Object { $_.Name } |
            Where-Object { [IO.Path]::GetExtension($_) -in '.c', '.h' -or $_.EndsWith('/build.cmd') })
          if (@(Compare-Object $nativeFiles $listedFiles).Count -ne 0) {
            throw 'Native build inputs and Source Manifest coverage differ.'
          }
          $managedSource = Get-Content src/RZeroF1.Minecraft.SeedMap.Core/Api.cs -Raw
          $nativeSource = Get-Content native/cubiomes/seedmap.c -Raw
          if (-not $managedSource.Contains('"' + $manifest.revision + '"') -or
              -not $nativeSource.Contains('"' + $manifest.revision + '"')) {
            throw 'Native/managed revision differs from Source Manifest.'
          }
          Write-Host "Verified $($entries.Count) Cubiomes source hashes and license files."

      - name: 构建 SDK（Release，win-x64）
        shell: pwsh
        run: dotnet build src/RZeroF1.Minecraft.SeedMap.Core/RZeroF1.Minecraft.SeedMap.Core.csproj -c Release -r win-x64 -nologo

      - name: 打包 NuGet
        shell: pwsh
        run: dotnet pack src/RZeroF1.Minecraft.SeedMap.Core/RZeroF1.Minecraft.SeedMap.Core.csproj -c Release -r win-x64 --no-restore -nologo

      - name: 检查包完整白名单与构建输出隔离
        shell: pwsh
        run: ./scripts/Test-ArtifactIsolation.ps1 -PackageDirectory artifacts/packages -OutputDirectory src/RZeroF1.Minecraft.SeedMap.Core/bin/Release/net10.0/win-x64

      - name: 检查随包文档、许可证与源码元数据
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression
          $packages = @(Get-ChildItem -Path artifacts/packages -Filter '*.nupkg' -File)
          $symbols = @(Get-ChildItem -Path artifacts/packages -Filter '*.snupkg' -File)
          if ($packages.Count -ne 1 -or $symbols.Count -ne 1) {
            throw "Expected one NuGet package and one symbols package; found $($packages.Count) and $($symbols.Count)."
          }

          foreach ($package in @($packages + $symbols)) {
            $archive = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
            try {
              $forbidden = @($archive.Entries | Where-Object {
                $_.FullName -match '(?i)do[ -]?not[ -]?submit|(^|[/\\])agents?\.md$'
              })
              if ($forbidden.Count -gt 0) {
                throw '包中包含禁止发布的文件；详细路径不写入日志。'
              }
            }
            finally { $archive.Dispose() }
          }

          $zip = [System.IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
            $required = @(
              'lib/net10.0/RZeroF1.Minecraft.SeedMap.dll',
              'lib/net10.0/RZeroF1.Minecraft.SeedMap.xml',
              'runtimes/win-x64/native/rzero_seedmap.dll',
              'README.md',
              'README.en.md',
              'docs/api.md',
              'docs/architecture.md',
              'docs/nuget.md',
              'docs/versions.md',
              'LICENSE',
              'THIRD-PARTY-NOTICES.md',
              'licenses/cubiomes/LICENSE',
              'licenses/cubiomes/SOURCE.md',
              'licenses/cubiomes/manifest.json'
            )
            foreach ($path in $required) {
              if ($path -notin $entries) { throw "NuGet package is missing: $path" }
            }
            $nuspec = $zip.Entries | Where-Object { $_.FullName -like '*.nuspec' } | Select-Object -First 1
            if (-not $nuspec) { throw 'Missing NuGet manifest.' }
            $reader = [System.IO.StreamReader]::new($nuspec.Open())
            try { [xml] $metadata = $reader.ReadToEnd() }
            finally { $reader.Dispose() }

            $id = $metadata.SelectSingleNode("//*[local-name()='metadata']/*[local-name()='id']")
            $version = $metadata.SelectSingleNode("//*[local-name()='metadata']/*[local-name()='version']")
            $projectUrl = $metadata.SelectSingleNode("//*[local-name()='metadata']/*[local-name()='projectUrl']")
            $readme = $metadata.SelectSingleNode("//*[local-name()='metadata']/*[local-name()='readme']")
            $license = $metadata.SelectSingleNode("//*[local-name()='metadata']/*[local-name()='license']")
            $repository = $metadata.SelectSingleNode("//*[local-name()='metadata']/*[local-name()='repository']")
            if ($id.InnerText -ne 'RZeroF1.Minecraft.SeedMap') { throw 'Unexpected NuGet package ID.' }
            if ($license.InnerText -ne 'MPL-2.0') { throw 'Unexpected NuGet license expression.' }
            [xml] $project = Get-Content -LiteralPath src/RZeroF1.Minecraft.SeedMap.Core/RZeroF1.Minecraft.SeedMap.Core.csproj -Raw
            $expectedVersion = $project.Project.PropertyGroup.PackageVersion | Where-Object { $_ }
            if (-not $version -or $version.InnerText -ne $expectedVersion.InnerText) {
              throw '包版本与项目版本不一致。'
            }
            $expectedUrl = 'https://github.com/RZeroF1/Minecraft-SeedUniverse'
            if (-not $projectUrl -or $projectUrl.InnerText -ne $expectedUrl -or
                -not $repository -or $repository.GetAttribute('url') -ne $expectedUrl) {
              throw 'NuGet 项目或源码仓库地址不正确。'
            }
            if (-not $readme -or $readme.InnerText -ne 'README.md') {
              throw 'NuGet 默认说明文档应为中文 README。'
            }
            if (-not $repository -or $repository.GetAttribute('commit') -ne $env:GITHUB_SHA) {
              throw 'NuGet 仓库提交信息与当前检出的 Git 提交不一致。'
            }
            Write-Host "已验证 $($packages[0].Name) 的版本、文档、仓库提交及 Native 与许可证资产。"
          }
          finally { $zip.Dispose() }

      - name: 独立还原并加载本次 NuGet 包
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $consumer = Join-Path $env:RUNNER_TEMP 'seedmap-package-consumer'
          New-Item -ItemType Directory -Path $consumer -Force | Out-Null
          [xml] $sdkProject = Get-Content src/RZeroF1.Minecraft.SeedMap.Core/RZeroF1.Minecraft.SeedMap.Core.csproj -Raw
          $packageVersion = ($sdkProject.Project.PropertyGroup.PackageVersion | Where-Object { $_ }).InnerText
          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <RuntimeIdentifier>win-x64</RuntimeIdentifier>
              <ImplicitUsings>enable</ImplicitUsings>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="RZeroF1.Minecraft.SeedMap" Version="$packageVersion" />
            </ItemGroup>
          </Project>
          "@ | Set-Content (Join-Path $consumer 'Consumer.csproj') -Encoding utf8
          @'
          using RZeroF1.Minecraft.SeedMap;
          using System.Diagnostics;
          using System.Security.Cryptography;
          foreach (var (release, id) in new[] { ("26.1", 149), ("26.2", 150), ("26.3", 151) })
          {
              if (Api.GetVersionCapability(release).NativeId != id ||
                  Api.GetTerrainCapability(release, 0, TerrainHeightmap.WorldSurfaceWorldGen).Accuracy != TerrainAccuracy.Exact)
                  throw new Exception("Package release profile mismatch: " + release);
              using var generator = Api.Create(new(123, id, 0, 64));
              if (Api.Generate(generator, 0, 0, 4, 4, 4, 64).Length != 16 ||
                  Api.GenerateTerrainHeights(generator, -1, -1, 3, 3).Length != 9)
                  throw new Exception("Package native computation failed: " + release);
              Api.QueryRegion(generator, 11, 0, 0);
          }
          var native = Process.GetCurrentProcess().Modules.Cast<ProcessModule>()
              .Single(module => module.ModuleName.Equals("rzero_seedmap.dll", StringComparison.OrdinalIgnoreCase));
          var hash = Convert.ToHexString(SHA256.HashData(File.ReadAllBytes(native.FileName)));
          if (hash != Environment.GetEnvironmentVariable("SEEDMAP_EXPECTED_NATIVE_SHA256"))
              throw new Exception("Consumer loaded a different Native DLL.");
          Console.WriteLine("PASS independent package restore, Java 26.x profiles and Native SHA-256 " + hash);
          '@ | Set-Content (Join-Path $consumer 'Program.cs') -Encoding utf8
          $localFeed = [Security.SecurityElement]::Escape((Join-Path (Get-Location).Path 'artifacts/packages'))
          @"
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$localFeed" />
              <add key="nuget" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="local"><package pattern="RZeroF1.Minecraft.SeedMap" /></packageSource>
              <packageSource key="nuget"><package pattern="*" /></packageSource>
            </packageSourceMapping>
          </configuration>
          "@ | Set-Content (Join-Path $consumer 'NuGet.config') -Encoding utf8
          $env:NUGET_PACKAGES = Join-Path $consumer 'packages'
          $env:SEEDMAP_EXPECTED_NATIVE_SHA256 = (Get-FileHash src/RZeroF1.Minecraft.SeedMap.Core/bin/Release/net10.0/win-x64/rzero_seedmap.dll -Algorithm SHA256).Hash
          dotnet restore (Join-Path $consumer 'Consumer.csproj') --configfile (Join-Path $consumer 'NuGet.config') --no-cache -nologo
          if ($LASTEXITCODE -ne 0) { throw 'Independent package restore failed.' }
          dotnet run --project (Join-Path $consumer 'Consumer.csproj') -c Release -r win-x64 --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Independent package consumer failed.' }

      - name: 归档已验证的包
        uses: actions/upload-artifact@v4
        with:
          name: seedmap-nuget-win-x64
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 14
